name: Code Quality

on:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: [master, main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # `npm install`, not `npm ci`: the committed lockfile records only the
      # darwin-arm64 build of lightningcss, because it was generated on macOS
      # and npm omits other platforms' optional binaries. `npm ci` installs the
      # lockfile verbatim and the Linux runner then has no lightningcss binary,
      # which breaks the CSS pipeline during `next build`. Switch back to
      # `npm ci` once the lockfile is regenerated on Linux.
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint
        continue-on-error: false

      - name: Check formatting
        run: npm run format:check
        continue-on-error: false

      - name: Test
        run: npm test
        continue-on-error: false

      - name: Build
        run: npm run build
        continue-on-error: false

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=shreegovinda_financeanalytics
            -Dsonar.organization=shreegovinda
